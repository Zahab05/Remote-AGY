name: "SLCM Task Detector 24/7"

on:
  schedule:
    # Berjalan otomatis setiap 3 jam sekali
    - cron: '0 */3 * * *'
  workflow_dispatch:
    # Memungkinkan pemicuan manual kapan saja dari tab Actions di GitHub
    inputs:
      force_simulation:
        description: 'Jalankan simulasi tugas dummy (True/False)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  check-assignments:
    name: "Check SLCM UI Tasks"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: "Restore Task Database Cache"
        uses: actions/cache@v4
        with:
          path: storage.db
          key: slcm-db-${{ github.run_id }}
          restore-keys: |
            slcm-db-

      - name: "Run Task Check / Simulation"
        env:
          UI_SSO_USERNAME: ${{ secrets.UI_SSO_USERNAME }}
          UI_SSO_PASSWORD: ${{ secrets.UI_SSO_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          FORCE_SIMULATION: ${{ inputs.force_simulation }}
        run: |
          chmod +x run.py

          if [ "$FORCE_SIMULATION" = "true" ]; then
            echo "[+] Mode: Simulasi Tugas Terpilih Manual"
            ./run.py --simulate-task
          elif [ -n "$UI_SSO_USERNAME" ] && [ -n "$UI_SSO_PASSWORD" ]; then
            echo "[+] Kredensial SSO UI terdeteksi, menjalankan pemeriksaan portal kampus..."
            ./run.py --check-now
          else
            echo "=========================================================================="
            echo "ℹ️ INFO: Secrets Kredensial SSO UI (UI_SSO_USERNAME / PASSWORD) belum diisi."
            echo "Menjalankan verifikasi sistem & simulasi pengujian agar Action berhasil."
            echo "Untuk menghubungkan ke portal kampus, tambahkan Secrets di:"
            echo "Repository -> Settings -> Secrets and variables -> Actions"
            echo "=========================================================================="
            python3 -m unittest discover tests
            ./run.py --simulate-task
          fi

      - name: "Display Recent Tasks Summary"
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          ./run.py --list-tasks

      - name: "Save Updated Database Artifact"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-database
          path: storage.db
          retention-days: 7
